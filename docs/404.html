<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { text-align: center; font-family: Arial, sans-serif; margin: 0; padding: 0; background: #fafafa; }
    h1 { font-size: 3em; margin-top: 2em; color: #d32f2f; }
    p { font-size: 1.2em; color: #555; }
  </style>
  <script>
    // Redirect all 404s to index.html for Angular routing
    var redirect = function() {
      var l = window.location;
      var file = '/index.html';
      if (l.pathname !== file) {
        window.location.replace(file + l.search + l.hash);
      }
    };
    setTimeout(redirect, 100);
  </script>
</head>
<body>
  <h1>404</h1>
  <p>Page not found. Redirecting to the home page...</p>
</body>
</html>
