<!-- about svg -->

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#e7f0ff"/>
    </linearGradient>
    <style>
      .skin { fill:#ffb48a; }
      .primary { fill:#213a72; }
      .accent { fill:#ff7a53; }
      .muted { fill:#4c5a72; }
    </style>
  </defs>

  <!-- soft blob background -->
  <path d="M140,360 C80,240 160,80 330,60 C540,40 640,170 760,160 C940,150 1070,240 1080,330 C1090,420 940,420 760,410 C560,400 200,480 140,360Z" fill="url(#bg)"/>

  <!-- person -->
  <g transform="translate(360,80)">
    <circle cx="60" cy="30" r="22" class="skin"/>
    <path d="M35,60 h50 v80 h-50 z" fill="#ffffff" stroke="#e9eef7" stroke-width="2" />
    <path d="M30,140 c20,70 40,120 100,120 h20 v10 h-160 c20-20 0-60 10-70 c5-5 15-10 30-60 z" class="muted" opacity="0.8"/>
    <path d="M58,18 c16,-20 48,-10 52,8 c4,18 -6,28 -6,28 l-8,-8 c-6,-10 -20,-16 -38,-18 z" class="primary" opacity="0.9"/>
    <rect x="38" y="70" width="44" height="12" rx="6" class="primary" opacity="0.8"/>
  </g>

  <!-- profile card -->
  <g transform="translate(720,120)">
    <rect rx="16" width="340" height="200" fill="#ffffff" stroke="#e9eef7" stroke-width="2"/>
    <rect rx="16" width="340" height="48" class="primary"/>
    <circle cx="72" cy="120" r="28" class="accent" opacity="0.9"/>
    <rect x="120" y="100" width="160" height="12" rx="6" class="muted" opacity="0.6"/>
    <rect x="120" y="124" width="120" height="12" rx="6" class="muted" opacity="0.6"/>
    <rect x="120" y="148" width="90" height="12" rx="6" class="muted" opacity="0.6"/>
  </g>

  <!-- plants / accents -->
  <g transform="translate(690,290)">
    <ellipse cx="70" cy="60" rx="80" ry="18" fill="#dbe4f5"/>
    <path d="M40,60 c0,-40 10,-70 24,-90" stroke="#8aa0c9" stroke-width="4" fill="none"/>
    <ellipse cx="66" cy="12" rx="12" ry="20" class="accent" opacity="0.9"/>
    <ellipse cx="92" cy="22" rx="10" ry="16" class="accent" opacity="0.7"/>
    <ellipse cx="36" cy="28" rx="10" ry="16" class="primary" opacity="0.6"/>
  </g>
</svg>