
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="privacyLockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9df"/>
      <stop offset="100%" stop-color="#fcb69f"/>
    </linearGradient>
    <style>
      .accent { fill:#ff6f61; }
      .primary { fill:#213a72; }
      .muted { fill:#4c5a72; }
    </style>
  </defs>

  <!-- Background blob -->
  <path d="M140,360 C100,250 180,90 360,70 C600,50 730,210 860,200 C1010,190 1110,270 1120,340 C1130,420 980,420 820,410 C600,395 200,480 140,360Z" fill="url(#privacyLockGrad)"/>

  <!-- Shield -->
  <g transform="translate(420,100)">
    <path d="M120,0 L240,60 L240,180 C240,260 180,320 120,340 C60,320 0,260 0,180 L0,60 Z" fill="#fff" stroke="#e9eef7" stroke-width="2"/>
    <!-- Lock inside shield -->
    <rect x="70" y="100" width="100" height="80" rx="12" class="primary"/>
    <circle cx="120" cy="140" r="12" fill="#fff"/>
    <path d="M90,100 v-30 a30,30 0 0 1 60,0 v30" stroke="#213a72" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="980" cy="80" r="24" fill="#fff" opacity="0.4"/>
  <circle cx="1040" cy="140" r="12" fill="#fff" opacity="0.4"/>
</svg>
