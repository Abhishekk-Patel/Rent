
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="termsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffecd2"/>
      <stop offset="100%" stop-color="#fcb69f"/>
    </linearGradient>
    <style>
      .accent { fill:#ff6f61; }
      .primary { fill:#213a72; }
      .muted { fill:#4c5a72; }
    </style>
  </defs>

  <!-- Background blob -->
  <path d="M140,360 C80,240 160,80 330,60 C540,40 640,170 760,160 C940,150 1070,240 1080,330 C1090,420 940,420 760,410 C560,400 200,480 140,360Z" fill="url(#termsGrad)"/>

  <!-- Document icon -->
  <g transform="translate(400,100)">
    <rect width="240" height="300" rx="16" fill="#fff" stroke="#e9eef7" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="60" class="primary"/>
    <rect x="20" y="80" width="200" height="12" rx="6" class="muted" opacity="0.6"/>
    <rect x="20" y="110" width="160" height="12" rx="6" class="muted" opacity="0.6"/>
    <rect x="20" y="140" width="180" height="12" rx="6" class="muted" opacity="0.6"/>
    <circle cx="200" cy="280" r="20" class="accent"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1000" cy="90" r="28" fill="#fff" opacity="0.4"/>
  <circle cx="1060" cy="130" r="10" fill="#fff" opacity="0.4"/>
