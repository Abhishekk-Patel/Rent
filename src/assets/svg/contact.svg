<!-- // contact svg  -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" aria-hidden="true">
  <defs>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffefe5"/>
      <stop offset="100%" stop-color="#fcb69f"/>
    </linearGradient>
    <style>
      .primary { fill:#213a72; }
      .accent { fill:#ff6f61; }
      .muted { fill:#4c5a72; }
    </style>
  </defs>

  <!-- background blob -->
  <path d="M140,360 C100,250 180,90 360,70 C600,50 730,210 860,200 C1010,190 1110,270 1120,340 C1130,420 980,420 820,410 C600,395 200,480 140,360Z" fill="url(#soft)"/>

  <!-- envelope -->
  <g transform="translate(720,140)">
    <rect width="320" height="200" rx="16" fill="#fff" stroke="#ffd7c6" stroke-width="2"/>
    <path d="M0,0 L160,120 L320,0 Z" fill="#ffe9df"/>
    <path d="M0,200 L160,80 L320,200 Z" fill="#ffe1d2"/>
    <circle cx="160" cy="120" r="14" class="accent"/>
  </g>

  <!-- phone icon -->
  <g transform="translate(420,160)" fill="#fff">
    <rect width="120" height="190" rx="18" class="primary"/>
    <rect x="10" y="10" width="100" height="12" rx="6" opacity="0.4"/>
    <circle cx="60" cy="170" r="12" opacity="0.6"/>
  </g>

  <!-- plants -->
  <g transform="translate(640,310)">
    <ellipse cx="80" cy="24" rx="90" ry="18" fill="#ffd7c6" opacity="0.6"/>
    <path d="M40,24 c0,-28 8,-50 20,-65" stroke="#a45d4c" stroke-width="4" fill="none"/>
    <ellipse cx="68" cy="0" rx="12" ry="18" class="accent"/>
    <ellipse cx="92" cy="6" rx="10" ry="16" class="primary" opacity="0.6"/>
    <ellipse cx="48" cy="10" rx="9" ry="14" class="accent" opacity="0.8"/>
  </g>
</svg>
