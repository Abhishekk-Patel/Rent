<mat-toolbar color="primary" class="header-toolbar">
  <!-- Left Section: Logo -->
  <div class="logo-section">
    <img src="./assets/Screenshot 2025-01-23 133108.png" alt="Company Logo" class="company-logo" />
  </div>

 

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- Right Section: Icons -->
  <div class="icon-section">
    <button mat-icon-button aria-label="Language">
      <mat-icon>language</mat-icon>
    </button>
    <button mat-icon-button aria-label="Notifications">
      <mat-icon>notifications</mat-icon>
    </button>
    <button [disabled]="cartItemCount===0" mat-icon-button class="cart" aria-label="Cart" matBadge="{{cartItemCount}}" matBadgePosition="above after" matBadgeColor="accent" (click)="openMyCard()">
      <mat-icon>shopping_cart</mat-icon>
    </button>
    <button mat-icon-button aria-label="Dark Mode" (click)="toggleDarkMode()">
      <mat-icon>brightness_4</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item>Profile</button>
      <button mat-menu-item>Settings</button>
      <button mat-menu-item>Logout</button>
    </mat-menu>
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Profile">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</mat-toolbar>
