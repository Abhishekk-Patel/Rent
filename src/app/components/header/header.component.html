<mat-toolbar color="primary" class="header-toolbar">
  <!-- Left Section: Logo -->
  <div class="logo-section">
    <img src="./assets/RentLogo.jpg" alt="Company Logo" class="company-logo" />
  </div>

  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- Right Section: Icons -->
  <div class="icon-section">
    <button *ngIf="!isAddNewProduct" mat-raised-button style="background-color: brown; color: white; border: 1px solid white; border-radius: 15px;" aria-label="Rent It" class="blink" (click)="openAddProductDialog()">	
      <mat-icon>add</mat-icon>
      <span class="rent-text">Rent Your Clothes</span>
    </button>
    
    <button mat-icon-button aria-label="Language" matTooltip="{{countryCode}}" (click)="openLanguageDialog()"> 
      <mat-icon>language</mat-icon>
    </button> 
    <button mat-icon-button aria-label="Notifications" *ngIf="!isAddNewProduct" matTooltip="New product listed" [matBadge]="!isAddNewProduct ? 1 : 0" matBadgePosition="above after" matBadgeColor="accent">
      <mat-icon>notifications</mat-icon>
    </button>
   
    <button *ngIf="!isAddNewProduct"  [disabled]="cartService.getCartValue() === 0" mat-icon-button class="cart" aria-label="Cart" matBadge="{{cartService.getCartValue()}}" matBadgePosition="above after" matBadgeColor="accent" (click)="openMyCard()">
      <mat-icon>shopping_cart</mat-icon>
    </button>
    <button mat-icon-button aria-label="Dark Mode" (click)="toggleDarkMode()">
      <mat-icon>brightness_4</mat-icon>
    </button>
    
    <div *ngIf="!isAddNewProduct">
    <mat-menu  #userMenu="matMenu">
      <button mat-menu-item (click)="this.router.navigate(['my-account'])">Account</button>
      <button mat-menu-item>Settings</button>
      <button mat-menu-item (click)="this.router.navigate([''])">Logout</button>
    </mat-menu>
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Profile">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
  </div>
</mat-toolbar>
