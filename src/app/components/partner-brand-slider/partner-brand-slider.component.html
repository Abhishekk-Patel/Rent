<section class="partner-brands-slider" fxLayout="column" fxLayoutAlign="start stretch">
  <!-- Hero Banner Section -->
  <div class="main-slider" fxLayout="row" fxLayoutAlign="start center">
    <div class="brand" *ngFor="let brand of brands; let i = index" [class.active]="i === currentIndex">
      <div class="cta-img-wrapper">
        <div class="img-btn-container">
          <img [src]="brand.imageUrl" [alt]="brand.name" class="brand-img" />
          <!-- Call-to-Action Buttons -->
          <div class="button-wrapper img-overlay-btns" *ngIf="!isMobileView">
            <!-- <button mat-raised-button color="primary" class="cta-btn" (click)="scrollToContent()">
              <span>Browse Collection</span>
              <mat-icon>touch_app</mat-icon>
            </button> -->
            <button mat-raised-button color="primary" class="cta-btn browse-catalog-btn" (click)="scrollToCatalog()">
              <span>Browse Collection</span>
              <mat-icon>collections_bookmark</mat-icon>
            </button>
            <button mat-raised-button color="accent" class="cta-btn product-btn" (click)="addNewProduct()">
              <span>Add a Product</span>
              <mat-icon>add_circle</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation Dots -->
  <div class="nav-dots">
    <div *ngFor="let brand of brands; let i = index" class="nav-dot" [class.active]="i === currentIndex" (click)="goToSlide(i)"></div>
  </div>
