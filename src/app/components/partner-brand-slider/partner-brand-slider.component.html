<section class="partner-brands-slider">
  <div class="brand" *ngFor="let brand of brands; let i = index" [class.active]="i === currentIndex">
    <img [src]="brand.imageUrl" [alt]="brand.name">
  </div>

  <button class="nav-btn left small-btn" (click)="prevSlide()"><mat-icon>chevron_left</mat-icon></button>
  <button class="nav-btn right small-btn" (click)="nextSlide()"><mat-icon>chevron_right</mat-icon></button>
</section>
