<div class="sort-panel">
  <div class="header">
    <h3>Sort & Filter</h3>
    <div class="header-actions">
      <button class="reset-btn" (click)="resetAll()">Reset All</button>
      <button class="close-btn" (click)="this.close.emit()">&times;</button>
    </div>
  </div>

  <div class="content">
    <!-- Alphabetical Sorting -->
    <div class="section">
      <h4>Sort By Name</h4>
      <div class="sort-btns-container">
        <button
          class="sort-btn"
          [ngClass]="{ 'btn-disabled': isAscApplied }"
          [attr.aria-pressed]="isAscApplied"
          (click)="applySort('asc')"
          type="button"
        >
          <mat-icon *ngIf="isAscApplied" style="font-size: 14px; width: 14px; height: 14px; margin-right: 4px;">check</mat-icon>
          A→Z
        </button>
        <button
          class="sort-btn"
          [ngClass]="{ 'btn-disabled': isDescApplied }"
          [attr.aria-pressed]="isDescApplied"
          (click)="applySort('desc')"
          type="button"
        >
          <mat-icon *ngIf="isDescApplied" style="font-size: 14px; width: 14px; height: 14px; margin-right: 4px;">check</mat-icon>
          Z→A
        </button>
      </div>
    </div>

    <!-- Price Filter -->
    <div class="section">
      <h4>Price Range</h4>
      <div class="price-filter">
        <label for="minPrice">Min (₹)</label>
        <input
          type="number"
          id="minPrice"
          [(ngModel)]="minPrice"
          placeholder="0"
          min="0"
        />
        <label for="maxPrice">Max (₹)</label>
        <input
          type="number"
          id="maxPrice"
          [(ngModel)]="maxPrice"
          placeholder="100000"
          min="0"
        />
      </div>
    </div>

    <!-- Location Filter -->
    <div class="section">
      <h4>Location</h4>
      <div class="location-filter">
        <input
          type="text"
          id="location"
          [(ngModel)]="location"
          placeholder="City or pincode"
          class="location-input"
          aria-label="Search by location"
        />
      </div>
    </div>
  </div>

  <!-- Apply Button -->
  <button
    class="apply-btn"
    (click)="apply()"
    [disabled]="!isAscApplied && !isDescApplied && !isPriceFilterApplied() && !location"
  >
    Apply
  </button>
</div>
