<div class="sort-panel">
  <div class="header">
    <h3>Sort & Filter</h3>
    <div class="header-actions">
      <button class="reset-btn" (click)="resetAll()">Reset All</button>
      <button class="close-btn" (click)="this.close.emit()">&times;</button>
    </div>
  </div>

  <div class="content">
    <!-- Alphabetical Sorting -->
    <div class="section">
      <h4>Alphabetical</h4>
      <div class="sort-btns-container">
        <button
          class="sort-btn"
          [ngClass]="{ 'btn-disabled': isAscApplied }"
          [disabled]="isAscApplied"
          (click)="applySort('asc')"
        >
          A to Z
        </button>
        <button
          class="sort-btn"
          [ngClass]="{ 'btn-disabled': isDescApplied }"
          [disabled]="isDescApplied"
          (click)="applySort('desc')"
        >
          Z to A
        </button>
      </div>
    </div>

    <!-- Price Filter -->
    <div class="section">
      <h4>Price</h4>
      <div class="price-filter">
        <label for="minPrice">Min:</label>
        <input
          type="number"
          id="minPrice"
          [(ngModel)]="minPrice"
          placeholder="0"
        />
        <label for="maxPrice">Max:</label>
        <input
          type="number"
          id="maxPrice"
          [(ngModel)]="maxPrice"
          placeholder="1000"
        />
      </div>
    </div>

    <!-- Location Filter -->
    <div class="section">
      <h4>Location</h4>
      <div class="location-filter">
        <input
          type="text"
          id="location"
          [(ngModel)]="location"
          placeholder="Enter location"
          class="location-input"
        />
      </div>
    </div>
  </div>

  <!-- Apply Button -->
  <button
    class="apply-btn"
    (click)="apply()"
    [disabled]="!isAscApplied && !isDescApplied && !isPriceFilterApplied() && !location"
  >
    Apply
  </button>
</div>
